# Hot-reload dev mode for panel.rookari.com.
#
# Runs Vite's own dev server (instant HMR on save) instead of the production
# nginx build in docker-compose.yml. Source is bind-mounted, so edits on disk
# show up in the browser in ~1s with no rebuild step.
#
# This REPLACES docker-compose.yml — don't run both, they'd fight over the
# `cabinet_frontend` container name and host port. Same container name is
# deliberate: Caddy's panel.rookari.com route (`reverse_proxy cabinet_frontend:80`)
# needs no change to work with either mode.
#
# Switch to dev mode:
#   docker compose -f docker-compose.yml -f docker-compose.rc.yml down
#   docker compose -f docker-compose.dev.yml up -d
#
# Switch back to the production build:
#   docker compose -f docker-compose.dev.yml down
#   docker compose -f docker-compose.yml -f docker-compose.rc.yml up -d --build

services:
  cabinet-frontend:
    image: node:24-alpine
    container_name: cabinet_frontend
    restart: unless-stopped
    working_dir: /app
    # VITE_API_URL is irrelevant here: Caddy's /api/* block on panel.rookari.com
    # intercepts API calls before they ever reach this container, so Vite's own
    # dev-server /api proxy never fires through the real domain. The cabinet's
    # liveness probe is different: it requests /health/unified at the site root,
    # which Caddy sends here, so Vite's /health proxy must reach the bot.
    command: >
      sh -c "[ -d node_modules/vite ] || npm ci &&
             npm run dev -- --host 0.0.0.0 --port 80"
    env_file:
      - .env.dev
    environment:
      # Target of Vite's /api and /health proxies (vite.config.ts). Its default,
      # localhost:8080, is this container itself, where nothing listens.
      DEV_API_PROXY_TARGET: http://remnawave_bot:8080
    volumes:
      - .:/app
      - cabinet_frontend_node_modules:/app/node_modules
    ports:
      - '${CABINET_PORT:-3020}:80'
    networks:
      - remnawave-network

networks:
  remnawave-network:
    name: remnawave-network
    external: true

volumes:
  cabinet_frontend_node_modules:
